name: CI Pix
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'igooruh/pix-backend' }}
      PUSH_ENABLED: ${{ vars.DOCKERHUB_PUSH_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testes (obrigatórios antes do build)
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build da imagem
        run: docker build --tag "igooruh/pix-backend:${GITHUB_SHA}" .
      - name: Push no Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PUSH_ENABLED == 'true'
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Configure DOCKERHUB_USERNAME}"
          : "${DOCKERHUB_TOKEN:?Configure DOCKERHUB_TOKEN}"
          IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${GITHUB_SHA}"
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag "igooruh/pix-backend:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
